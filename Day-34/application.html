<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <label for="first-name">First Name</label>
      <input type="text" required id="first-name" name="f-name" />
      <br />
      <br />
      <label for="last-name">Last Name</label>
      <input type="text" required id="last-name" name="l-name" />
      <br />
      <br />
      <label for="email">Email</label>
      <input type="email" required id="email" name="email" />
      <br />
      <br />
      <p>Gender:</p>
      <label for="female">Female</label>
      <input type="radio" required id="female" name="gender" />

      <label for="male">Male</label>
      <input type="radio" required id="male" name="gender" />
      <label for="others">Others</label>
      <input type="radio" required id="others" name="gender" />

      <br />
      <br />
      <label for="date-of-birth">Date of Birth: </label>
      <input type="date" id="date-of-birth" name="date-of-birth" required />
      <br />
      <br />
      <p>Skills</p>
      <input type="checkbox" id="java" name="java" />
      <label id="java">Java</label>

      <input type="checkbox" id="html" name="html" />
      <label id="html">HTML</label>
      <input type="checkbox" id="css" name="css" />
      <label id="css">CSS</label>
      <input type="checkbox" id="javascript" name="javascript" />
      <label id="javascript">JavaScript</label>
      <br />
      <br />
      <input type="submit" />
    </form>
  </body>
</html>
